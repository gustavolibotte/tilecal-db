name: "tilecal-db"
version: ${TILECAL_DB_VERSION}
services:
  web-server:    
    build:
      context: .
      dockerfile: ./Dockerfile
    image: tilecal-db:${TILECAL_DB_VERSION}
    container_name: tilecal-db-web-server
    tty: true
    volumes:
      - type: bind
        source: ./tilecal-db/
        target: /usr/local/tilecal-db/
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:8080
      - DB_HOSTNAME=${DB_HOSTNAME}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DRIVER=${DB_DRIVER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - CERN_PASSWORD=${CERN_PASSWORD}
      - CERN_USERNAME=${CERN_USERNAME}
      - OPENID_PROVIDER=${OPENID_PROVIDER}
  database:
    image: mysql:8.0.28
    container_name: tilecal-db-mysql
    volumes:
      - type: volume
        source: mysqldata
        target: /var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: tilecal-phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=${DB_HOSTNAME}
  oc:
    image: gitlab-registry.cern.ch/paas-tools/openshift-client
    container_name: oc-container
    tty: true
  python:
    image: python:3.10.12
    container_name: tilecal-db-python
    tty: true
    volumes:
      - type: bind
        source: ./tilecal-db
        target: /usr/local/tilecal-db
volumes:
  mysqldata: