name: "tilecal-db"
version: ${TILECAL_DB_VERSION}
services:
  web-server:
    build:
      context: .
      dockerfile: ./dockerfiles/web_server.dockerfile
      args:
        - app_baseURL=${app_baseURL}
        - app_indexPage=${app_indexPage}
        - sso_auth=${sso_auth}
        - frontend_clientId=${frontend_clientId}
        - ENVIRONMENT=${ENVIRONMENT}
    image: tilecal-db:${TILECAL_DB_VERSION}
    container_name: tilecal-db-web-server
    tty: true
    volumes:
      - type: bind
        source: ./backend/
        target: /var/www/html
      - type: bind
        source : .
        target: /root/tilecal-db
    ports:
      - "8080:8080"
    environment:
      - CI_ENVIRONMENT=${ENVIRONMENT}
    env_file:
      - .env
  database:
    image: mysql:8.0.28
    container_name: tilecal-db-mysql
    volumes:
      - type: volume
        source: mysqldata
        target: /var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
  openshift:
    image: gitlab-registry.cern.ch/paas-tools/openshift-client
    container_name: openshift-client
    tty: true
  python:
    build:
      context: .
      dockerfile: ./dockerfiles/testing.dockerfile
    image: tilecal-db-testing
    container_name: tilecal-db-testing
    tty: true
    ports:
      - "8089:8089"
    volumes:
      - type: bind
        source : .
        target: /root/tilecal-db
    env_file:
      - .env
volumes:
  mysqldata: