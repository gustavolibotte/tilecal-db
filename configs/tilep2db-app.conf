<VirtualHost *:80>
    DocumentRoot "/var/www/html/public"
    ServerName   tilp2db.local
    ErrorLog     "${APACHE_LOG_DIR}/tilep2db-error_log"
    CustomLog    "${APACHE_LOG_DIR}/tilep2db-access_log" common

    <Directory "/var/www/html/public">
        OPtions -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>