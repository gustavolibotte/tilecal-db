<VirtualHost *:8080>
    DocumentRoot "/var/www/html/public"
    ServerName tilep2db
    ServerAdmin tile.phase2db@cern.ch
    ErrorLog "${APACHE_LOG_DIR}/tilep2db-error_log"
    CustomLog "${APACHE_LOG_DIR}/tilep2db-access_log" common

    <Directory "/var/www/html/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>